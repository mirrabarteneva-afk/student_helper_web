<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="/static/registration.css">
</head>
<body>
    <div class="forms">
        <!-- Переключатель форм -->
        <div class="form-switcher">
            <button type="button" class="switch-btn active" data-form="login">Войти</button>
            <button type="button" class="switch-btn" data-form="register">Зарегистрироваться</button>
        </div>

        {% if errors %}
            <div class="alert alert-error">
                {% for error in errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Форма входа -->
        <form class="user_data login-form active" method="post" action="/login">
            <label for="login_username">Введите имя или номер телефона: </label>
            <input type="text" id="login_username" name="username" placeholder="Имя или email" required><br>

            <label for="login_password">Введите пароль: </label>
            <input type="password" id="login_password" name="password" placeholder="Пароль" required><br>

            <button type="submit" class="submit-btn">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form class="user_data register-form" method="post" action="/register">
            <label for="username">Введите Ваше имя: </label>
            <input type="text" id="username" name="username" placeholder="Введите имя" required><br>

            <label for="phone_number">Введите Ваш номер телефона: </label>
            <input type="tel" id="phone_number" name="phone_number" placeholder="Введите номер телефона" required><br>

            <label for="password">Введите пароль: </label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required><br>

            <label for="password_repeat">Подтвердите пароль: </label>
            <input type="password" id="password_repeat" name="password_repeat" placeholder="Подтвердите пароль" required><br>

            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>
    </div>
    <script src="/static/js/form-switcher.js"></script>
</body>
</html>
